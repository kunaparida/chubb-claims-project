spring.application.name=claims-notification-service
server.port=${PORT:8081}

# ---- Kafka: read the topic the claims backend publishes to (app.events.topic there) ----
# 9094 is the port compose publishes for tools on your own machine; inside Docker use SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=${NOTIFICATIONS_GROUP_ID:claims-notification-service}
# A new group starts at the beginning of the topic, so a claimant is told about events published before this service first started.
spring.kafka.consumer.auto-offset-reset=earliest
# Offsets are committed by the container after each record has been handled, never before.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

notifications.topic=${EVENTS_TOPIC:claims.claim-status-changed}
notifications.dead-letter-topic=${DEAD_LETTER_TOPIC:claims.claim-status-changed.dlt}
# The claims web app: each email links to <portal-url>/claims/<id>
notifications.portal-url=${PORTAL_URL:http://localhost:4200}
notifications.dedupe-capacity=10000
notifications.retry.max-retries=${NOTIFICATIONS_MAX_RETRIES:3}
notifications.retry.initial-delay-ms=${NOTIFICATIONS_RETRY_DELAY_MS:1000}
notifications.retry.multiplier=2.0
notifications.retry.max-delay-ms=30000

# ---- Email ----
# smtp: send through the server below.  log: only write the email to the log (no mail server needed; local use only).
notifications.mail.mode=${NOTIFICATIONS_MAIL_MODE:log}
notifications.mail.from=${MAIL_FROM:Claims Platform <no-reply@claims.local>}
# Defaults suit a local dev inbox such as Mailpit (SMTP on 1025, no login). For a real server set these environment variables;
# never write a password into a file that is committed.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# Without these a dead mail server would hold the consumer thread for minutes.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ---- Health (used by Docker) ----
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
