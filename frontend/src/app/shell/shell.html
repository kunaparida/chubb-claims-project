<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/" aria-label="Claims Platform home"><app-logo [light]="true" /></a>
    <nav aria-label="Main">
      @for (item of nav(); track item.link) {
        <a [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><app-icon [name]="item.icon" />{{ item.label }}</a>
      }
    </nav>
    <div class="spacer"></div>
    <div class="user">
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="user-text">
        <strong>{{ auth.user()?.fullName }}</strong>
        <small>{{ roleLabel() }}</small>
      </span>
    </div>
    <button type="button" class="link" aria-label="Sign out" (click)="auth.logout()"><app-icon name="logout" /><span class="btn-label">Sign out</span></button>
  </div>
</header>
<main class="page"><router-outlet /></main>
<footer class="app-footer">Claims Platform · APAC motor and property claims</footer>
