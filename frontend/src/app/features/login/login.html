<div class="login-wrap">
  <form class="card login" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Claims</h1>
    <p class="muted">Sign in to report, track or process claims.</p>

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" />

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="primary" [disabled]="busy() || form.invalid">
      {{ busy() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="muted center">New claimant? <a routerLink="/register">Create an account</a></p>

    <details class="demo">
      <summary>Local demo accounts</summary>
      <p class="muted">
        Seeded by the backend for local use. Password: <code>{{ demoPassword }}</code>
      </p>
      <div class="demo-list">
        @for (a of demo; track a.email) {
          <button type="button" class="ghost" (click)="fill(a.email)">{{ a.label }} — {{ a.email }}</button>
        }
      </div>
    </details>
  </form>
</div>
