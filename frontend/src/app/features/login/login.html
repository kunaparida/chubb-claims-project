<app-auth-shell>
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-logo class="auth-mark" />
    <h1>Welcome back</h1>
    <p class="muted">Sign in to report, track or process claims.</p>

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" placeholder="you@example.com" />

    <label for="password">Password</label>
    <div class="password-field">
      <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
      <button type="button" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
        <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" />
      </button>
    </div>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="primary" [disabled]="busy() || form.invalid">
      {{ busy() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="muted center alt">New claimant? <a routerLink="/register">Create an account</a></p>

    <details class="demo">
      <summary>Local demo accounts</summary>
      <p class="muted">
        Seeded by the backend for local use. Password: <code>{{ demoPassword }}</code>
      </p>
      <div class="demo-list">
        @for (a of demo; track a.email) {
          <button type="button" class="ghost" (click)="fill(a.email)">{{ a.label }} — {{ a.email }}</button>
        }
      </div>
    </details>
  </form>
</app-auth-shell>
