server {
    listen 80;
    server_name _;

    # Document uploads: the backend accepts 5 MB per file (6 MB per request). nginx's default is 1 MB, which would refuse them with a 413 first.
    client_max_body_size 7m;

    root /usr/share/nginx/html;
    index index.html;

    # The backend has no CORS configuration, so the browser must only ever talk to this origin.
    # nginx forwards /api/... to the backend container (same job as frontend/proxy.conf.json in `npm start`).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: any other path falls back to index.html so deep links such as /claims/3 survive a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
