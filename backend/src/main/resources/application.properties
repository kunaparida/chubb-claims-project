server.port=${PORT:8080}

spring.application.name=claims-management

# PostgreSQL. The defaults match the postgres service in docker-compose.yml and the local setup in DOCKER.md (part 9).
# Override with environment variables; use a real password outside local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/claimsdb}
spring.datasource.username=${DB_USERNAME:claims}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver
# "update" creates and extends tables on start-up. Fine for this assessment; use Flyway migrations for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Override with a unique Base64-encoded secret of at least 32 bytes outside local development.
app.jwt.secret=${JWT_SECRET:VGhpc0lzQUxvY2FsRGV2ZWxvcG1lbnRLZXlGb3JDbGFpbXNBUEkxMjM0NTY=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.bootstrap.enabled=${BOOTSTRAP_USERS:true}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:ChangeMe123!}

springdoc.swagger-ui.path=/swagger-ui.html

# Domain events (transactional outbox). "log" runs with no broker; set to "kafka" and configure
# spring.kafka.bootstrap-servers to publish ClaimStatusChanged events to a Kafka topic.
app.events.publisher=${EVENTS_PUBLISHER:log}
app.events.topic=${EVENTS_TOPIC:claims.claim-status-changed}
app.outbox.poll-ms=${OUTBOX_POLL_MS:5000}
# spring.kafka.bootstrap-servers=localhost:9092
