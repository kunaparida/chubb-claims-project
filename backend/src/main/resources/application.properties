server.port=${PORT:8080}


spring.application.name=claims-management

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:claimsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true


# PostgreSQL example (set the datasource values above from environment in production):
# spring.datasource.url=jdbc:postgresql://localhost:5432/claimsdb
# spring.datasource.username=${DB_USERNAME:claims}
# spring.datasource.password=${DB_PASSWORD:change-me}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Override with a unique Base64-encoded secret of at least 32 bytes outside local development.
app.jwt.secret=${JWT_SECRET:VGhpc0lzQUxvY2FsRGV2ZWxvcG1lbnRLZXlGb3JDbGFpbXNBUEkxMjM0NTY=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.bootstrap.enabled=${BOOTSTRAP_USERS:true}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:ChangeMe123!}

springdoc.swagger-ui.path=/swagger-ui.html

# Domain events (transactional outbox). "log" runs with no broker; set to "kafka" and configure
# spring.kafka.bootstrap-servers to publish ClaimStatusChanged events to a Kafka topic.
app.events.publisher=${EVENTS_PUBLISHER:log}
app.events.topic=${EVENTS_TOPIC:claims.claim-status-changed}
app.outbox.poll-ms=${OUTBOX_POLL_MS:5000}
