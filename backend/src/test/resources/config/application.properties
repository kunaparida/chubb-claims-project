# Test-only overrides. Spring Boot reads classpath:/config/application.properties on top of the main application.properties,
# so everything not listed here (JWT secret, events, bootstrap users, ...) keeps its main value.
#
# Tests run on in-memory H2 in PostgreSQL compatibility mode so they need no database server. Lower-case identifiers and
# PostgreSQL null ordering make it behave like the real database for the SQL Hibernate generates here.
spring.datasource.url=jdbc:h2:mem:claimstest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
