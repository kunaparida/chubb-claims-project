# Claims Platform: Kafka + backend + notification service (+ a local inbox) + frontend.   Start with:  docker compose up --build -d
# Full instructions: DOCKER.md
name: chubb-claims

services:
  # Single-node Kafka in KRaft mode (no ZooKeeper). Two listeners:
  #   kafka:9092      for containers on this compose network (the backend)
  #   localhost:9094  for tools on your own machine
  kafka:
    image: apache/kafka:3.9.0
    container_name: claims-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # the topic is created explicitly by kafka-init below
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot job: creates the topics, then exits (auto-creation is off above).
  #   claims.claim-status-changed       what the backend publishes and the notification service reads (EVENTS_TOPIC below)
  #   claims.claim-status-changed.dlt   where the notification service parks a record it could not turn into an email (DEAD_LETTER_TOPIC below)
  # Keep the names in sync with the environment of the two services (the defaults in their application.properties are the same names).
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: claims-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists
        --topic claims.claim-status-changed
        --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists
        --topic claims.claim-status-changed.dlt
        --partitions 1 --replication-factor 1

  backend:
    build:
      context: ./backend
    container_name: claims-backend
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

    restart: unless-stopped
    environment:
      # "kafka" publishes outbox events to the broker above. Run  EVENTS_PUBLISHER=log docker compose up  to skip Kafka.
      EVENTS_PUBLISHER: ${EVENTS_PUBLISHER:-kafka}
      EVENTS_TOPIC: claims.claim-status-changed
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_POLL_MS: "5000"

      # H2 console: off unless you start the stack with H2_CONSOLE_ENABLED=true (see DOCKER.md part 5.5). It needs no sign-in.
      H2_CONSOLE_ENABLED: ${H2_CONSOLE_ENABLED:-false}
      H2_CONSOLE_ALLOW_OTHERS: ${H2_CONSOLE_ENABLED:-false}

      # Optional overrides (defaults come from application.properties and are for local use only):
      #   JWT_SECRET: <Base64 secret, at least 32 bytes>
      #   BOOTSTRAP_PASSWORD: <password for the seeded officer and manager accounts>
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v3/api-docs > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # A local inbox for the notification service: it catches every email so you can read it at http://localhost:8025.
  # Nothing is delivered to a real address. To send real email, point MAIL_HOST (and the MAIL_* variables below) at your own SMTP server.
  mailpit:
    image: axllent/mailpit:latest
    container_name: claims-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  # Reads claim status events from Kafka and emails the claimant. Needs the backend to publish to Kafka (EVENTS_PUBLISHER=kafka, the default here).
  notification-service:
    build:
      context: ./notification-service
    container_name: claims-notification
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENTS_TOPIC: claims.claim-status-changed
      DEAD_LETTER_TOPIC: claims.claim-status-changed.dlt
      # The address the "View your claim" link in each email points at (the claims web app as seen from your browser).
      PORTAL_URL: ${PORTAL_URL:-http://localhost:4200}
      # smtp sends through MAIL_HOST; "log" only writes the email to the container log.
      NOTIFICATIONS_MAIL_MODE: ${NOTIFICATIONS_MAIL_MODE:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-Claims Platform <no-reply@claims.local>}
      # Only for a real SMTP server. Put the password in your shell or a git-ignored .env file, never in this file.
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    container_name: claims-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
