# Claims Platform: Kafka + backend + frontend.   Start with:  docker compose up --build -d
# Full instructions: DOCKER.md
name: chubb-claims

services:
  # Single-node Kafka in KRaft mode (no ZooKeeper). Two listeners:
  #   kafka:9092      for containers on this compose network (the backend)
  #   localhost:9094  for tools on your own machine
  kafka:
    image: apache/kafka:3.9.0
    container_name: claims-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # the topic is created explicitly by kafka-init below
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot job: creates the topic the backend publishes to, then exits.
  # Keep the topic name in sync with EVENTS_TOPIC below (the backend's default is the same name).
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: claims-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists
        --topic claims.claim-status-changed
        --partitions 3 --replication-factor 1

  backend:
    build:
      context: ./backend
    container_name: claims-backend
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      # "kafka" publishes outbox events to the broker above. Run  EVENTS_PUBLISHER=log docker compose up  to skip Kafka.
      EVENTS_PUBLISHER: ${EVENTS_PUBLISHER:-kafka}
      EVENTS_TOPIC: claims.claim-status-changed
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_POLL_MS: "5000"
      # Optional overrides (defaults come from application.properties and are for local use only):
      #   JWT_SECRET: <Base64 secret, at least 32 bytes>
      #   BOOTSTRAP_PASSWORD: <password for the seeded officer and manager accounts>
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v3/api-docs > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    container_name: claims-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
